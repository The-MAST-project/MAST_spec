# Ruff configuration for MAST_spec.
#
# Mirrors the MAST fleet standard (originally defined in MAST_unit's
# pyproject.toml [tool.ruff]) so every repo formats identically. The ruff
# version is pinned in requirements-dev.txt (ruff==0.16.0); config alone is
# not enough — formatter output can differ between ruff versions.
#
# Note: lint rule selection lives under [lint] (the modern location); the
# original unit config declared `extend-select` at the top level, which is
# deprecated in current ruff. Behaviour is equivalent.

line-length = 125
target-version = "py312"

# Submodules are owned by their own repos — never format them from here.
# (ruff does NOT skip submodules automatically; without this, `ruff format .`
# would recurse into and rewrite common/.)
#
# The greateyes SDK wrapper is vendored upstream code (see
# cameras/greateyes/sdk/VENDOR.md). Formatting it rewrites the vendor's comment
# separators and blank lines, which buries the ~80 real lines of an SDK bump in
# hundreds of lines of cosmetic churn. Keep it byte-identical to the archive.
extend-exclude = ["common", "cameras/greateyes/sdk/greateyesSDK.py"]

# Honour the excludes above even when a path is passed explicitly. Without this,
# editor format-on-save (.vscode/settings.json turns it on, and the ruff
# extension passes the open file by name) and file-passing pre-commit hooks
# would still rewrite the vendored SDK.
force-exclude = true

[lint]
# Enable rules from common linters.
extend-select = [
    "F",   # Pyflakes (runtime errors)
    "E",   # pycodestyle (formatting)
    "W",   # pycodestyle warnings
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C90", # mccabe complexity
    "SIM", # flake8-simplify
    "TID", # tidy imports
]
# Optionally ignore some rules:
# ignore = ["E501"]  # example: disable line-length enforcement

[format]
# Ruff's Black-compatible formatter.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
