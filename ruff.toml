# Ruff configuration for MAST_spec.
#
# Mirrors the MAST fleet standard (originally defined in MAST_unit's
# pyproject.toml [tool.ruff]) so every repo formats identically. The ruff
# version is pinned in requirements-dev.txt (ruff==0.16.0); config alone is
# not enough — formatter output can differ between ruff versions.
#
# Note: lint rule selection lives under [lint] (the modern location); the
# original unit config declared `extend-select` at the top level, which is
# deprecated in current ruff. Behaviour is equivalent.

line-length = 125
target-version = "py312"

# MAST_common is no longer checked out inside this repo (it was the `common`
# submodule; it is now a sibling clone, <top>/common/), so there is nothing here
# to exclude. Keep this file scoped to this repo's own sources. First-party
# classification of `common` comes from [lint.isort] below, not from `src`.
#
# The greateyes SDK wrapper is upstream code (see cameras/greateyes/sdk/VENDOR.md).
# Formatting it rewrites the vendor's comment separators and blank lines, which
# buries the ~80 real lines of an SDK bump in hundreds of lines of cosmetic churn.
# Keep it byte-identical to the archive.
#
# The other three trees are here for the same reason: upstream code we do not own.
# Andor's pyAndorSDK2 alone accounted for 891 of this repo's 938 pep8-naming
# findings -- vendor Hungarian notation, none of it ours to rename.
#
# The two QHY scratch files below are a different category: our own code, not a
# vendor's. Neither is reachable. `qhy600-bug.py` is a bug-repro script that
# cannot be imported at all -- the hyphen makes it an invalid module name, which
# is what N999 was reporting -- and `demo.py` is demo code nothing imports,
# the same thing as `another_demo/` above and excluded for the same reason.
# Together they carried 39 of the repo's 119 findings, including every UP031
# and every F841, none of it in code that runs.
#
# `qhy600.py` is deliberately NOT here: highspec.py imports QHY600 from it.
extend-exclude = [
    "cameras/greateyes/sdk/greateyesSDK.py",
    "cameras/andor/sdk",
    "cameras/qhy/another_demo",
    "cameras/qhy/demo.py",
    "cameras/qhy/qhy600-bug.py",
    "filter_wheel/sdk",
]

# Honour the exclude above even when a path is passed explicitly. Without this,
# editor format-on-save (.vscode/settings.json turns it on, and the ruff
# extension passes the open file by name) and file-passing pre-commit hooks
# would still rewrite the vendored SDK.
force-exclude = true

[lint]
# Enable rules from common linters.
extend-select = [
    "F",   # Pyflakes (runtime errors)
    "E",   # pycodestyle (formatting)
    "W",   # pycodestyle warnings
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C90", # mccabe complexity
    "SIM", # flake8-simplify
    "TID", # tidy imports
]
# Optionally ignore some rules:
# ignore = ["E501"]  # example: disable line-length enforcement

[lint.flake8-bugbear]
# FastAPI's parameter markers are meant to be called in a default. B008 exists to
# catch a default that is built once at import and then shared across calls, which
# is a real bug for a list or a dict -- but `Body(...)` is a marker object the
# framework unpacks, not the value the endpoint receives.
#
# Only one site needs this: highspec.do_autofocus. Every other endpoint spells its
# markers `Annotated[X, Query(...)]`, which puts the call in the annotation where
# B008 does not look, so nothing else in the repo fires.
#
# That site is also the case B008 argues FOR: its actual default already comes from
# `default_factory`, deferred per call. The lambda around the factory is likewise
# load-bearing, not noise -- make_current_autofocus_settings() is defined ~600 lines
# further down the file, so a bare name reference here would raise NameError at
# import. Do not "simplify" it.
extend-immutable-calls = ["fastapi.Body"]


[lint.pep8-naming]
# Andor's SDK names its capability struct fields in Hungarian notation --
# ulAcqModes, ulEMGainCapability, ulTriggerModes, ... -- and `class Capabilities`
# in cameras/andor/newton.py mirrors that struct field for field. The names are the
# vendor's ABI, not our style choice: renaming them to snake_case would break the
# one property that makes the mapping checkable against Andor's own header, so all
# 13 fields raised N815 with no fix available.
#
# A name pattern rather than a per-file ignore, because it states *why* these are
# exempt. `ul*` is the vendor's prefix and appears nowhere else in this repo.
# `extend-` keeps ruff's built-in ignore list (setUp, tearDown, ...).
extend-ignore-names = ["ul*"]

[lint.mccabe]
# Raised from ruff's default of 10.
#
# This is driver code. `on_timer`, `start_exposure`, `driver_event_handler` and the
# camera constructors branch on detected/connected/powered/cooling state, on vendor
# return codes, and on which of several hardware configurations is present. That
# branching is the problem domain, not a failure to decompose it -- and these are the
# paths with the least test coverage in the repo, so restructuring them is a refactor
# carrying real risk, not a clean-up. Section 6 of
# code-validation-and-ci-guidelines.md says to prefer this over rewriting them.
#
# 20 clears 9 of the 11 functions that exceeded the default, while still flagging the
# two genuine outliers, which carry an explicit `noqa: C901` naming their score:
# GreatEyes.on_timer (26) and NewtonEMCCD.__init__ (23).
#
# The cost of a threshold over per-site noqa: it applies to code not yet written, so a
# new function can reach 20 branches unchallenged. Accepted knowingly -- the alternative
# was eleven annotations, and the two that matter are named above and tracked for
# refactoring rather than annotated away.
max-complexity = 20


[lint.isort]
# `common` is MAST_common, our own shared library -- first-party, grouped with
# the local modules (cameras, filter_wheel, stage, ...). Without this, ruff's
# resolver splits the package: bare `from common import ...` lands in the
# first-party block while `from common.config import ...` is treated as
# third-party, so every isort run reshuffles the import block and the next
# person reverts it. It also no longer lives under this repo at all (it is a
# sibling clone), so ruff's path-based resolver could not classify it correctly
# even in principle -- naming it here is the only reliable way.
known-first-party = ["common"]

[format]
# Ruff's Black-compatible formatter.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
